name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      working-directory: ./code
    - name: Create google_services.json
      run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > app/google_services.json
    - name: Build with Gradle
      run: ./gradlew build
      working-directory: ./code
